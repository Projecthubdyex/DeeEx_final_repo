<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeeEx — Study</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dash-body">

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">DeeEx</div>
    <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link-item">📊 Dashboard</a>
        <a href="app-courses.html" class="nav-link-item">📚 My courses</a>
        <a href="app-assessment.html" class="nav-link-item">📝 Assessments</a>
        <a href="app-study.html" class="nav-link-item active">📖 Study</a>
        <a href="app-progress.html" class="nav-link-item">📈 Progress</a>
        <a href="app-leaderboard.html" class="nav-link-item">🏆 Leaderboard</a>
        <a href="app-settings.html" class="nav-link-item">⚙️ Settings</a>
    </nav>
    <div class="sidebar-bottom">
        <div class="user-row">
            <div class="user-avatar" id="sidebarAvatar">?</div>
            <div class="user-info">
                <p id="sidebarName">Loading...</p>
                <span id="sidebarDept">—</span>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">🚪 Log out</button>
    </div>
</aside>

<div class="main-wrapper">

    <!-- Course list view -->
    <div id="view-courses">
        <div class="topbar">
            <div class="topbar-left">
                <p class="meta">Study</p>
                <h1>Study materials</h1>
            </div>
            <div class="topbar-right">
                <div class="icon-btn hamburger-btn" onclick="openSidebar()">☰</div>
            </div>
        </div>

        <div class="assessment-controls">
            <div class="search-bar">
                <input type="text" id="studySearch" placeholder="Search courses..." onkeyup="filterStudyCourses()">
            </div>
        </div>

        <div class="assessment-grid" id="studyCourseGrid">
            <p class="empty-msg">Loading courses...</p>
        </div>
    </div>

    <!-- Course detail view (notes + videos) -->
    <div id="view-course-detail" style="display:none">
        <div class="topbar">
            <div class="topbar-left">
                <button class="quiz-nav-btn" onclick="backToCourses()" style="margin-bottom:8px">← Back</button>
                <p class="meta" id="detailCourseMeta">—</p>
                <h1 id="detailCourseTitle">—</h1>
            </div>
            <div class="topbar-right">
                <div class="icon-btn hamburger-btn" onclick="openSidebar()">☰</div>
            </div>
        </div>

        <!-- Topic filter -->
        <div class="filter-tabs" id="topicFilterTabs" style="margin-bottom:20px;flex-wrap:wrap;gap:10px;display:flex">
            <button class="filter-tab active" data-topic="" onclick="setTopicFilter(this)">All topics</button>
        </div>

        <!-- Tabs: Notes / Videos -->
        <div class="study-tabs">
            <button class="study-tab active" onclick="setStudyTab('notes', this)">📝 Notes</button>
            <button class="study-tab" onclick="setStudyTab('videos', this)">🎬 Videos</button>
        </div>

        <!-- Notes section -->
        <div id="study-notes-section">
            <div id="studyNotesList">
                <p class="empty-msg">Loading notes...</p>
            </div>
        </div>

        <!-- Videos section -->
        <div id="study-videos-section" style="display:none">
            <div id="studyVideosList">
                <p class="empty-msg">Loading videos...</p>
            </div>
        </div>
    </div>

</div>

<!-- Note reader modal -->
<div class="modal-overlay" id="noteReaderModal">
    <div class="modal-card modal-large">
        <button class="modal-close" onclick="hideModal('noteReaderModal')">✕</button>
        <h3 id="noteReaderTitle"></h3>
        <div id="noteReaderContent" class="note-reader-body"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="main.js"></script>
<script src="app-study.js"></script>
</body>
</html>
